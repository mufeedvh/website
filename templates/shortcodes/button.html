<div class="button-wrapper{% if align %} align-{{ align }}{% endif %}{% if wrapper_class %} {{ wrapper_class }}{% endif %}">
{%- if href -%}
    <a class="btn{% if button_class %} {{ button_class }}{% endif %}" href="{{ href }}"{% if id %} id="{{ id }}"{% endif %}{% if target %} target="{{ target }}" rel="noopener"{% endif %}{% if style %} style="{{ style }}"{% endif %}>
{%- else -%}
    <button type="button" class="btn{% if button_class %} {{ button_class }}{% endif %}"{% if id %} id="{{ id }}"{% endif %}{% if onclick %} onclick="{{ onclick }}"{% endif %}{% if style %} style="{{ style }}"{% endif %}>
{%- endif -%}
        <span class="btn-text">{{ text | safe }}</span>
        {%- if icon %}
            {%- if icon is containing("fa-link") %} <svg class="svg-icon" aria-hidden="true"><use href="#icon-link"/></svg>
            {%- elif icon is containing("fa-x-twitter") or icon is containing("fa-twitter") %} <span aria-hidden="true">𝕏</span>
            {%- elif icon is containing("fa-message") %} <svg class="svg-icon" aria-hidden="true"><use href="#icon-message"/></svg>
            {%- else %} {{ icon }}
            {%- endif -%}
        {%- endif -%}
{%- if href -%}
    </a>
{%- else -%}
    </button>
{%- endif -%}
</div>
