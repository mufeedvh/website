<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#0d0d0d" />

        <meta property="og:site_name" content="Mufeed VH" />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Space+Grotesk:wght@300..700&family=UnifrakturMaguntia&family=JetBrains+Mono:wght@400;500&display=swap"

        <title>404 - Page Not Found - Mufeed VH</title>

        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/styles.css" />

        <link rel="alternate" type="application/rss+xml" title="RSS" href="https://mufeedvh.com/rss.xml" />

        <meta name="robots" content="noindex, follow" />
        <style>
            .void-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 70vh;
                text-align: center;
                padding: var(--space-8) var(--space-4);
            }

            .void-code {
                font-family: var(--font-fancy);
                font-size: 8rem;
                line-height: 1;
                color: var(--text-primary);
                letter-spacing: 0.05em;
                margin-bottom: var(--space-4);
                position: relative;
                opacity: 0;
                animation: voidReveal 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            }

            .void-code::after {
                content: "";
                position: absolute;
                bottom: -0.15em;
                left: 50%;
                transform: translateX(-50%);
                width: 3em;
                border-bottom: 1px dotted var(--border-dotted);
            }

            .void-message {
                font-family: var(--font-body);
                font-size: var(--text-base);
                color: var(--text-secondary);
                font-style: italic;
                max-width: 420px;
                margin: var(--space-8) auto var(--space-6);
                line-height: 1.6;
                opacity: 0;
                animation: voidReveal 1s cubic-bezier(0.19, 1, 0.22, 1) 0.3s forwards;
            }

            .void-rabbit {
                margin: var(--space-6) auto var(--space-8);
                opacity: 0;
                animation: voidReveal 1s cubic-bezier(0.19, 1, 0.22, 1) 0.5s forwards;
            }

            .void-rabbit svg {
                width: 80px;
                height: 80px;
                color: var(--text-tertiary);
                opacity: 0.4;
            }

            .void-rabbit svg .rabbit-body {
                animation: rabbitLook 6s ease-in-out infinite;
                transform-origin: center bottom;
            }

            @keyframes rabbitLook {
                0%,
                100% {
                    transform: translateX(0);
                }
                30% {
                    transform: translateX(-3px) rotate(-2deg);
                }
                60% {
                    transform: translateX(3px) rotate(2deg);
                }
            }

            .void-back {
                font-family: var(--font-display);
                font-size: var(--text-xs);
                text-transform: uppercase;
                letter-spacing: 0.15em;
                color: var(--text-secondary);
                border: 1px dotted var(--border-dotted);
                padding: 0.7rem 1.5rem;
                transition: all var(--transition-fast);
                opacity: 0;
                animation: voidReveal 1s cubic-bezier(0.19, 1, 0.22, 1) 0.7s forwards;
            }

            .void-back:hover {
                color: var(--text-primary);
                border-style: solid;
                border-color: var(--text-primary);
            }

            @keyframes voidReveal {
                from {
                    opacity: 0;
                    transform: translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media screen and (max-width: 768px) {
                .void-code {
                    font-size: 5rem;
                }

                .void-container {
                    min-height: 60vh;
                }
            }
        </style>
    </head>
    <body>
        <!-- SVG Icons -->
        <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
            <symbol id="icon-link" viewBox="0 0 640 512">
                <path
                    d="M579.8 267.7c56.5-56.5 56.5-148 0-204.5c-50-50-128.8-56.5-186.3-15.4l-1.6 1.1c-14.4 10.3-17.7 30.3-7.4 44.6s30.3 17.7 44.6 7.4l1.6-1.1c32.1-22.9 76-19.3 103.8 8.6c31.5 31.5 31.5 82.5 0 114L422.3 334.8c-31.5 31.5-82.5 31.5-114 0c-27.9-27.9-31.5-71.8-8.6-103.8l1.1-1.6c10.3-14.4 6.9-34.4-7.4-44.6s-34.4-6.9-44.6 7.4l-1.1 1.6C206.5 251.2 213 330 263 380c56.5 56.5 148 56.5 204.5 0L579.8 267.7zM60.2 244.3c-56.5 56.5-56.5 148 0 204.5c50 50 128.8 56.5 186.3 15.4l1.6-1.1c14.4-10.3 17.7-30.3 7.4-44.6s-30.3-17.7-44.6-7.4l-1.6 1.1c-32.1 22.9-76 19.3-103.8-8.6C74 372 74 321 105.5 289.5L217.7 177.2c31.5-31.5 82.5-31.5 114 0c27.9 27.9 31.5 71.8 8.6 103.9l-1.1 1.6c-10.3 14.4-6.9 34.4 7.4 44.6s34.4 6.9 44.6-7.4l1.1-1.6C433.5 260.8 427 182 377 132c-56.5-56.5-148-56.5-204.5 0L60.2 244.3z"
                />
            </symbol>
            <symbol id="icon-message" viewBox="0 0 512 512">
                <path
                    d="M64 0C28.7 0 0 28.7 0 64V352c0 35.3 28.7 64 64 64h96v80c0 6.1 3.4 11.6 8.8 14.3s11.9 2.1 16.8-1.5L309.3 416H448c35.3 0 64-28.7 64-64V64c0-35.3-28.7-64-64-64H64z"
                />
            </symbol>
            <symbol id="icon-rabbit" viewBox="0 0 100 100">
                <!-- Hole -->
                <ellipse cx="50" cy="80" rx="45" ry="12" fill="currentColor" />
                <!-- Rabbit Head peeking -->
                <path
                    d="M28 80c0-20 12-32 22-32s22 12 22 32"
                    fill="var(--bg-deep)"
                    stroke="currentColor"
                    stroke-width="5"
                />
                <!-- Left Ear -->
                <path
                    d="M38 52c-8-25-2-42 5-42s8 17 5 42"
                    fill="var(--bg-deep)"
                    stroke="currentColor"
                    stroke-width="5"
                />
                <!-- Right Ear -->
                <path
                    d="M62 52c8-25 2-42-5-42s-8 17-5 42"
                    fill="var(--bg-deep)"
                    stroke="currentColor"
                    stroke-width="5"
                />
                <!-- Eyes -->
                <circle cx="43" cy="70" r="4" fill="currentColor" />
                <circle cx="57" cy="70" r="4" fill="currentColor" />
                <!-- Nose -->
                <circle cx="50" cy="77" r="2.5" fill="currentColor" />
            </symbol>
        </svg>

        <aside class="sidebar">
            <div class="sidebar-top">
                <a href="/" class="logo-monogram" aria-label="Mufeed VH">

                    <div class="name-extension" aria-hidden="true">

            <div class="sidebar-bottom">

                </a>

        <div class="layout-wrapper">
            <div id="pattern-border" class="pattern-border" aria-hidden="true"></div>
            <main class="content">
                <div class="void-container">
                    <div class="void-code" aria-hidden="true">404</div>

                    <div class="void-rabbit" aria-hidden="true">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <g class="rabbit-body">
                                <ellipse cx="50" cy="84" rx="40" ry="10" fill="currentColor" opacity="0.3" />
                                <path
                                    d="M30 82c0-18 10-28 20-28s20 10 20 28"
                                    fill="var(--bg-deep)"
                                    stroke="currentColor"
                                    stroke-width="4"
                                />
                                <path
                                    d="M38 58c-7-22-2-38 5-38s7 16 4 38"
                                    fill="var(--bg-deep)"
                                    stroke="currentColor"
                                    stroke-width="4"
                                />
                                <path
                                    d="M62 58c7-22 2-38-5-38s-7 16-4 38"
                                    fill="var(--bg-deep)"
                                    stroke="currentColor"
                                    stroke-width="4"
                                />
                                <circle cx="43" cy="72" r="3" fill="currentColor" />
                                <circle cx="57" cy="72" r="3" fill="currentColor" />
                                <ellipse cx="50" cy="77" rx="2" ry="1.5" fill="currentColor" />
                                <text
                                    x="50"
                                    y="68"
                                    text-anchor="middle"
                                    font-size="6"
                                    font-family="var(--font-display)"
                                    fill="currentColor"
                                    opacity="0.5"
                                >
                                    ?
                                </text>
                            </g>
                        </svg>
                    </div>

                    <p class="void-message">
                        You've wandered into a liminal space. This page doesn't exist — or perhaps it never did.
                    </p>

                    <a href="/" class="void-back">← Back to reality</a>
                </div>
            </main>
        </div>
    </body>
</html>
